# Local HyperDX tracing & log stack for local development.
# Decoupled to accept telemetry from multiple services and repositories.
#
# Web UI:       http://${HYPERDX_CONNECT_IP}:${HYPERDX_UI_PORT}
# OTLP HTTP:    http://${HYPERDX_CONNECT_IP}:${HYPERDX_OTLP_HTTP_PORT} (POST /v1/traces, POST /v1/logs)
# OTLP gRPC:    http://${HYPERDX_CONNECT_IP}:${HYPERDX_OTLP_GRPC_PORT}
# ClickHouse:   http://${HYPERDX_CONNECT_IP}:${HYPERDX_CLICKHOUSE_HTTP_PORT}
#
# Services live here; start through the wrapper docker-compose.yaml (it loads .env).

services:
  hyperdx:
    build:
      context: .
      dockerfile: Dockerfile
    image: hyperdx-local:latest
    container_name: hyperdx
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - HYPERDX_APP_LISTEN_HOSTNAME=0.0.0.0
      - TZ=${TZ:?TZ must be set in .env}
      - FRONTEND_URL=http://localhost:${HYPERDX_UI_PORT:?HYPERDX_UI_PORT must be set in .env}
      - HYPERDX_API_PORT=8000
      - HYPERDX_APP_PORT=${HYPERDX_UI_PORT:?HYPERDX_UI_PORT must be set in .env}
      - HYPERDX_LOG_LEVEL=info
      - USAGE_STATS_ENABLED=false
      # Pre-configured ClickHouse connection for hyperdx-local (skips GUI connection wizard)
      - 'NEXT_PUBLIC_HDX_LOCAL_DEFAULT_CONNECTIONS=[{"id":"local","name":"Local ClickHouse","host":"http://localhost:${HYPERDX_CLICKHOUSE_HTTP_PORT:-8123}","username":"default","password":""}]'
      # Pre-configured default sources for OTEL traces & logs in hyperdx-local (skips GUI source creation wizard)
      - 'NEXT_PUBLIC_HDX_LOCAL_DEFAULT_SOURCES=[{"id":"l-logs","from":{"databaseName":"default","tableName":"otel_logs"},"kind":"log","timestampValueExpression":"TimestampTime","displayedTimestampValueExpression":"Timestamp","name":"Logs","implicitColumnExpression":"Body","serviceNameExpression":"ServiceName","bodyExpression":"Body","eventAttributesExpression":"LogAttributes","resourceAttributesExpression":"ResourceAttributes","defaultTableSelectExpression":"Timestamp,ServiceName,SeverityText,Body","severityTextExpression":"SeverityText","traceIdExpression":"TraceId","spanIdExpression":"SpanId","connection":"local","traceSourceId":"l-traces"},{"id":"l-traces","from":{"databaseName":"default","tableName":"otel_traces"},"kind":"trace","timestampValueExpression":"Timestamp","displayedTimestampValueExpression":"Timestamp","name":"Traces","implicitColumnExpression":"SpanName","serviceNameExpression":"ServiceName","eventAttributesExpression":"SpanAttributes","resourceAttributesExpression":"ResourceAttributes","defaultTableSelectExpression":"Timestamp,ServiceName,StatusCode,round(Duration/1e6),SpanName","traceIdExpression":"TraceId","spanIdExpression":"SpanId","durationExpression":"Duration","durationPrecision":9,"parentSpanIdExpression":"ParentSpanId","spanNameExpression":"SpanName","spanKindExpression":"SpanKind","statusCodeExpression":"StatusCode","statusMessageExpression":"StatusMessage","connection":"local","logSourceId":"l-logs"}]'
    volumes:
      - hyperdx_ch_data:/var/lib/clickhouse
      - hyperdx_mongo_data:/data/db
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${HYPERDX_UI_PORT:-8088} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  hyperdx_ch_data:
    name: hyperdx_clickhouse_data
  hyperdx_mongo_data:
    name: hyperdx_mongo_data
